
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Jogo de Cara ou Coroa">
    <title>Cara ou Coroa</title>

    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="Iconfactory-aranha.png" type="image/x-icon">
</head>

<body>

    <div class="container">

        <h1>Cara ou Coroa</h1>

        <div class="stats">
            <p id="heads-count">🪙 Cara: 0</p>
            <p id="tails-count">👑 Coroa: 0</p>
        </div>

        <div class="coin" id="coin">

            <div class="heads">
                <img src="cara.png" alt="Cara">
            </div>

            <div class="tails">
                <img src="coroa.png" alt="Coroa">
            </div>

        </div>

        <div class="buttons">
            <button id="flip-button">JOGAR MOEDA</button>
            <button id="reset-button">RESETAR</button>
        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
